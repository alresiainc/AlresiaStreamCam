<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alresia StreamCam</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="#171b20" stroke="#2b3138" stroke-width="1"/>
        <circle cx="16" cy="16" r="7.5" fill="none" stroke="#ff4d2e" stroke-width="2"/>
        <circle cx="16" cy="16" r="3" fill="#ff4d2e"/>
      </svg>
      <div class="popup-title">
        <h1>StreamCam</h1>
        <span class="popup-version">SIMPLE MODE</span>
      </div>
    </div>

    <div class="popup-body">
      <div class="popup-status" id="statusArea">
        <div class="status-row">
          <span class="status-dot idle" id="statusDot"></span>
          <span id="statusText">No source selected</span>
        </div>
      </div>

      <button class="popup-btn primary" id="selectSourceBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <span id="selectSourceLabel">Select Source</span>
      </button>

      <div class="source-picker hidden" id="sourcePicker">
        <button class="source-pick-item" data-source="camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
          Camera
        </button>
        <button class="source-pick-item" data-source="screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Screen
        </button>
        <button class="source-pick-item" data-source="window">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M2 8h20"/><path d="M8 21h8M12 17v4"/></svg>
          Window
        </button>
        <button class="source-pick-item" data-source="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>
          Browser Tab
        </button>
      </div>

      <div class="popup-quick-actions">
        <button class="popup-btn secondary" id="vcamBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>
          </svg>
          Virtual Cam
        </button>
        <button class="popup-btn secondary" id="streamBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          Stream
        </button>
      </div>
    </div>

    <div class="popup-footer">
      <button class="link-btn" id="advancedLink">Advanced Mode</button>
      <span class="footer-dot">·</span>
      <button class="link-btn" id="settingsLink">Settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
