<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamCam</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo-mark">
          <svg viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="#1a1a1a"/>
            <circle cx="14" cy="14" r="6" stroke="#E8491D" stroke-width="2" fill="none"/>
            <circle cx="14" cy="14" r="2.5" fill="#E8491D"/>
          </svg>
        </div>
        <div>
          <div class="header-title">StreamCam</div>
          <div class="header-sub" id="modeLabel">Simple Mode</div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">No source selected</span>
    </div>

    <!-- Main Action -->
    <div class="main-action">
      <button class="btn-source" id="selectSourceBtn">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="16" height="11" rx="2"/>
          <path d="M7 17h6M10 14v3"/>
        </svg>
        <span id="selectSourceLabel">Select Source</span>
      </button>

      <!-- Source Picker (hidden by default) -->
      <div class="source-list hidden" id="sourcePicker">
        <button class="source-item" data-source="camera">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m13 11 4.35 2.9a.5.5 0 0 0 .77-.42V6.52a.5.5 0 0 0-.75-.43L13 9"/><rect x="2" y="5" width="11" height="10" rx="2"/></svg>
          Camera
        </button>
        <button class="source-item" data-source="screen">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="11" rx="2"/><path d="M7 17h6M10 14v3"/></svg>
          Screen
        </button>
        <button class="source-item" data-source="window">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="11" rx="2"/><path d="M2 7h16"/><path d="M7 17h6M10 14v3"/></svg>
          Window
        </button>
        <button class="source-item" data-source="tab">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M11 2v5h5"/></svg>
          Browser Tab
        </button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="actions-row">
      <button class="btn-action" id="vcamBtn">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5h-4L6 6H3a1.5 1.5 0 0 0-1.5 1.5v7A1.5 1.5 0 0 0 3 16h14a1.5 1.5 0 0 0 1.5-1.5V7.5A1.5 1.5 0 0 0 17 6h-3z"/>
          <circle cx="10" cy="11" r="2.5"/>
        </svg>
        Virtual Cam
      </button>
      <button class="btn-action" id="streamBtn">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.5 10s3.5-6.5 8.5-6.5 8.5 6.5 8.5 6.5-3.5 6.5-8.5 6.5S1.5 10 1.5 10z"/>
          <circle cx="10" cy="10" r="2.5"/>
        </svg>
        Stream
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="footer-link" id="advancedLink">Advanced Mode</button>
      <span class="footer-sep">|</span>
      <button class="footer-link" id="settingsLink">Settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
