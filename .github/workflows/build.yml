name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS installer
        run: |
          mkdir -p native-host/installer/dist

          # The .command file IS the installer — no DMG, no .pkg
          # Users download it, right-click → Open, and it handles everything
          cp native-host/installers/install-mac.command native-host/installer/dist/StreamCam-Installer.command
          chmod +x native-host/installer/dist/StreamCam-Installer.command

          echo "Built: StreamCam-Installer.command"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: native-host/installer/dist/*.command
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows installer
        shell: bash
        run: |
          mkdir -p native-host/installer/dist

          # Create staging directory
          STAGING="native-host/installer/dist/StreamCam-Windows"
          mkdir -p "$STAGING"

          # Copy host files
          cp native-host/host.js "$STAGING/"
          cp native-host/install.js "$STAGING/"
          cp native-host/vcam-setup.js "$STAGING/"
          cp native-host/package.json "$STAGING/"
          cp -r native-host/platform "$STAGING/"

          # Create install.bat
          cat > "$STAGING/install.bat" << 'BATEOF'
          @echo off
          title StreamCam Installer
          color 0F
          echo.
          echo  StreamCam Installer
          echo  ===================
          echo.
          echo  Checking for Node.js...
          where node >nul 2>&1
          if %ERRORLEVEL% neq 0 (
              echo  Node.js not found. Opening download page...
              start https://nodejs.org
              echo  Please install Node.js, then run install.bat again.
              pause
              exit /b 1
          )
          echo  Node.js found.
          echo.
          echo  Installing dependencies...
          cd /d "%~dp0"
          call npm install --production >nul 2>&1
          echo  Dependencies installed.
          echo.
          echo  Registering native host...
          node install.js
          echo.
          echo  Setting up virtual camera...
          node vcam-setup.js setup
          echo.
          echo  Done! Restart Chrome to use StreamCam.
          pause
          BATEOF

          # Create README
          cat > "$STAGING/README.txt" << 'READMEEOF'
          StreamCam — Windows Installer
          ==============================
          
          1. Make sure Node.js is installed (https://nodejs.org)
          2. Double-click install.bat
          3. Follow the prompts
          4. Restart Chrome
          5. Click the StreamCam icon and try "Virtual Cam"
          READMEEOF

          # Create ZIP
          cd native-host/installer/dist
          powershell -Command "Compress-Archive -Path 'StreamCam-Windows' -DestinationPath 'StreamCam-Installer-Windows.zip' -Force"

          echo "Built: StreamCam-Installer-Windows.zip"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: native-host/installer/dist/*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DEB package
        run: bash native-host/installer/build.sh

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: native-host/installer/dist/*.deb
          if-no-files-found: error

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
