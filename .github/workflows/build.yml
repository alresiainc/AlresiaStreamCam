name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG installer
        run: bash native-host/installer/build.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: native-host/installer/dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProjectRoot = "native-host"
          $InstallerDir = "$ProjectRoot/installer"
          $DistDir = "$InstallerDir/dist"
          $Staging = "$DistDir/staging"

          if (Test-Path $DistDir) { Remove-Item -Recurse -Force $DistDir }
          New-Item -ItemType Directory -Force -Path $Staging | Out-Null

          # Copy host files
          Copy-Item "$ProjectRoot/host.js" "$Staging/"
          Copy-Item "$ProjectRoot/install.js" "$Staging/"
          Copy-Item "$ProjectRoot/vcam-setup.js" "$Staging/"
          Copy-Item "$ProjectRoot/package.json" "$Staging/"
          Copy-Item -Recurse "$ProjectRoot/platform" "$Staging/"

          # Create install.bat
          $Bat = @'
          @echo off
          title StreamCam Installer
          echo.
          echo  StreamCam Installer
          echo  ===================
          echo.
          echo  Checking for Node.js...
          where node >nul 2>&1
          if %ERRORLEVEL% neq 0 (
              echo  Node.js not found. Opening download page...
              start https://nodejs.org
              echo  Please install Node.js, then run this again.
              pause
              exit /b 1
          )
          echo  Node.js found.
          echo.
          echo  Installing dependencies...
          cd /d "%~dp0"
          call npm install --production >nul 2>&1
          echo  Dependencies installed.
          echo.
          echo  Registering native host...
          node install.js
          echo.
          echo  Setting up virtual camera...
          node vcam-setup.js setup
          echo.
          echo  Done! Restart Chrome to use StreamCam.
          pause
          '@
          Set-Content -Path "$Staging/install.bat" -Value $Bat -Encoding ASCII

          # Create SED for iexpress
          $Sed = @"
          [Version]
          Class=IEXPRESS
          TEDVer=2000
          [Options]
          PackagePurpose=Install
          ShowInstallProgram=1
          SelfExtract=1
          AppName=StreamCam Installer
          AppVersion=1.0.0
          AppPublisher=Alresia
          TargetName=StreamCam-Installer-Setup.exe
          StagingDir=$Staging
          CompressionType=MSZIP
          SourceDir=$Staging
          [ExtractionOptions]
          ShowProgress=1
          RunProgram=install.bat
          "@
          Set-Content -Path "$DistDir/installer.sed" -Value $Sed -Encoding ASCII

          # Build with iexpress
          Push-Location $DistDir
          & iexpress /N installer.sed
          Pop-Location

          if (Test-Path "$DistDir/StreamCam-Installer.exe") {
              Move-Item "$DistDir/StreamCam-Installer.exe" "$DistDir/StreamCam-Installer-Setup.exe" -Force
              $Size = [math]::Round((Get-Item "$DistDir/StreamCam-Installer-Setup.exe").Length / 1KB)
              Write-Host "Built: StreamCam-Installer-Setup.exe ($Size KB)"
          } else {
              Write-Host "Build may have failed"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: native-host/installer/dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DEB package
        run: bash native-host/installer/build.sh

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: native-host/installer/dist/*.deb
          if-no-files-found: error

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
