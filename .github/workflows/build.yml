name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .pkg installer
        run: bash native-host/installer/build.sh

      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: native-host/installer/dist/*.pkg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .exe installer (iexpress)
        shell: pwsh
        run: |
          # Create a self-extracting installer using iexpress (built into Windows)
          # This bundles the native host files into a small .exe

          $distDir = "native-host\installer\dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # Create a temporary directory with all host files
          $staging = "$distDir\staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item "native-host\host.js" "$staging\"
          Copy-Item "native-host\install.js" "$staging\"
          Copy-Item "native-host\vcam-setup.js" "$staging\"
          Copy-Item "native-host\package.json" "$staging\"
          Copy-Item -Recurse "native-host\platform" "$staging\"

          # Create post-install batch file
          $batch = @"
          @echo off
          echo.
          echo StreamCam Installer
          echo ===================
          echo.
          echo Checking for Node.js...
          where node >nul 2>&1
          if %ERRORLEVEL% neq 0 (
              echo Node.js not found. Please install from https://nodejs.org
              start https://nodejs.org
              pause
              exit /b 1
          )
          echo Node.js found.
          echo.
          echo Installing dependencies...
          cd /d "%~dp0"
          call npm install --production
          echo.
          echo Registering native host...
          node install.js
          echo.
          echo Setting up virtual camera...
          node vcam-setup.js setup
          echo.
          echo Done! Restart Chrome to use StreamCam.
          pause
          "@
          Set-Content -Path "$staging\install.bat" -Value $batch

          # Create iexpress SED file for self-extracting installer
          $sed = @"
          [Version]
          Class=IEXPRESS
          TEDVer=2000
          [Options]
          PackagePurpose=Install
          ShowInstallProgram=1
          InstallPrompt=%InstallPrompt%
          DisplayLicense=%DisplayLicense%
          FinishMessage=%FinishMessage%
          TargetName=%TargetName%
          FGUICID=%FGUICID%
          AppName=%AppName%
          AppVersion=%AppVersion%
          OrigName=%OrigName%
          StagingDir=%StagingDir%
          CompressionType=MSZIP
          FOPT=1
          [ExtractionOptions]
          ShowProgress=1
          HideFileProgress=1
          RunProgram=install.bat
          "@

          $sedPath = "$distDir\installer.sed"
          Set-Content -Path $sedPath -Value $sed

          # Build using iexpress
          & iexpress /N "$sedPath"

          # Move the output
          Move-Item "$distDir\StreamCam-Installer.exe" "$distDir\StreamCam-Installer-Setup.exe" -Force -ErrorAction SilentlyContinue

          # Cleanup
          Remove-Item -Recurse -Force "$staging" -ErrorAction SilentlyContinue
          Remove-Item "$sedPath" -ErrorAction SilentlyContinue

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: native-host/installer/dist/*.exe
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb package
        run: bash native-host/installer/build.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: native-host/installer/dist/*.deb
          if-no-files-found: error

  publish-release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts
        continue-on-error: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
