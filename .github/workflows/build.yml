name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: native-host/installer
        run: npm install

      - name: Build DMG
        working-directory: native-host/installer
        run: npx electron-builder --mac dmg --x64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: native-host/installer/dist/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: native-host/installer
        run: npm install

      - name: Build EXE
        working-directory: native-host/installer
        run: npx electron-builder --win nsis --x64

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: native-host/installer/dist/*.exe
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: native-host/installer
        run: npm install

      - name: Build DEB + AppImage
        working-directory: native-host/installer
        run: npx electron-builder --linux deb AppImage

      - name: Upload Linux builds
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            native-host/installer/dist/*.deb
            native-host/installer/dist/*.AppImage
          if-no-files-found: warn

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: artifacts/linux

      - name: List artifacts
        run: find artifacts -type f

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/*
            artifacts/windows/*
            artifacts/linux/*
          fail_on_unmatched_files: false
