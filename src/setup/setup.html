<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamCam Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d; color: #e0e0e0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 40px; max-width: 520px; width: 90%;
    }
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 22px; margin-bottom: 6px; color: #fff; }
    .header p { color: #666; font-size: 13px; }

    .platform-badge {
      display: inline-block; background: #222; border: 1px solid #444;
      padding: 5px 14px; border-radius: 20px; font-size: 13px; color: #aaa;
      margin-bottom: 24px;
    }

    .installer-box {
      background: #111; border: 1px solid #2a2a2a; border-radius: 10px;
      padding: 24px; text-align: center; margin-bottom: 20px;
    }
    .installer-box h3 { font-size: 15px; color: #f5a623; margin-bottom: 8px; }
    .installer-box p { font-size: 13px; color: #777; margin-bottom: 16px; }

    .download-btn {
      display: inline-block; padding: 13px 36px;
      background: #f5a623; color: #000; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
      text-decoration: none;
    }
    .download-btn:hover { opacity: 0.85; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: #444; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #222;
    }

    .fallback-section h4 {
      font-size: 12px; color: #555; margin-bottom: 8px; font-weight: 500;
    }
    .cmd-block {
      background: #111; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 12px; font-family: 'SF Mono', monospace;
      font-size: 12px; color: #f5a623; cursor: pointer; position: relative;
      transition: border-color 0.2s; word-break: break-all;
    }
    .cmd-block:hover { border-color: #f5a623; }
    .cmd-block .copy-label {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-size: 10px; color: #555; font-family: -apple-system, sans-serif;
    }
    .cmd-block.copied .copy-label { color: #4caf50; }

    .check-btn {
      display: none; margin-top: 14px; padding: 10px 24px;
      background: transparent; color: #f5a623; border: 1px solid #f5a623;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      width: 100%;
    }
    .check-btn:hover { background: rgba(245,166,35,0.06); }
    .status-msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 20px; }
    .status-msg.ok { color: #4caf50; }
    .status-msg.err { color: #f44336; }
    .note { color: #444; font-size: 11px; margin-top: 16px; text-align: center; }
    .note code { background: #1a1a1a; padding: 1px 5px; border-radius: 3px; color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🎥 StreamCam Setup</h1>
      <p>One-time setup for virtual camera & streaming host</p>
    </div>

    <div style="text-align:center">
      <div class="platform-badge" id="platformBadge">Detecting…</div>
    </div>

    <!-- Download Installer -->
    <div class="installer-box">
      <h3 id="installerTitle">Download Installer</h3>
      <p id="installerDesc">Handles everything automatically</p>
      <a class="download-btn" id="downloadBtn" href="#">Download</a>
    </div>

    <div class="divider">or install from source</div>

    <div class="fallback-section">
      <h4>Run this in a terminal</h4>
      <div class="cmd-block" id="cmdBlock" title="Click to copy"></div>
    </div>

    <button class="check-btn" id="checkBtn">Check Connection</button>
    <div class="status-msg" id="statusMsg"></div>
    <p class="note" id="noteText"></p>
  </div>

  <script src="setup.js"></script>
</body>
</html>
