<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamCam Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d; color: #e0e0e0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 40px; max-width: 540px; width: 90%;
    }
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 24px; margin-bottom: 6px; color: #fff; }
    .header p { color: #666; font-size: 13px; }

    /* ── Primary: Download Installer ─────────────────── */
    .installer-section {
      background: #141414; border: 1px solid #2a2a2a; border-radius: 10px;
      padding: 24px; margin-bottom: 20px; text-align: center;
    }
    .installer-section h3 {
      font-size: 15px; color: #f5a623; margin-bottom: 12px;
    }
    .installer-section p {
      font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.5;
    }
    .platform-badge {
      display: inline-block; background: #222; border: 1px solid #444;
      padding: 4px 14px; border-radius: 20px; font-size: 12px; color: #aaa;
      margin-bottom: 16px;
    }
    .download-btn {
      display: inline-block; padding: 12px 32px;
      background: #f5a623; color: #000; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
    }
    .download-btn:hover { opacity: 0.85; }
    .download-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Divider ─────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: #444; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #222;
    }

    /* ── Fallback: Terminal Command ───────────────────── */
    .fallback-section { margin-bottom: 20px; }
    .fallback-section h4 {
      font-size: 13px; color: #666; margin-bottom: 10px; font-weight: 500;
    }
    .cmd-block {
      background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 14px; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px; color: #f5a623; cursor: pointer; position: relative;
      transition: border-color 0.2s; word-break: break-all;
    }
    .cmd-block:hover { border-color: #f5a623; }
    .cmd-block .copy-label {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-size: 10px; color: #555; font-family: -apple-system, sans-serif;
    }
    .cmd-block.copied .copy-label { color: #4caf50; }

    /* ── Status ───────────────────────────────────────── */
    .status-msg { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
    .status-msg.ok { color: #4caf50; }
    .status-msg.err { color: #f44336; }

    .check-btn {
      display: none; margin-top: 12px; padding: 10px 24px;
      background: transparent; color: #f5a623; border: 1px solid #f5a623;
      border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .check-btn:hover { background: rgba(245,166,35,0.06); }

    .note { color: #444; font-size: 11px; margin-top: 16px; text-align: center; line-height: 1.5; }
    .note code { background: #1a1a1a; padding: 1px 5px; border-radius: 3px; color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🎥 StreamCam Setup</h1>
      <p>One-time setup for the virtual camera & streaming host</p>
    </div>

    <!-- Primary: Download Installer -->
    <div class="installer-section">
      <div class="platform-badge" id="platformBadge">Detecting platform…</div>
      <h3 id="installerTitle">Download Installer</h3>
      <p id="installerDesc">A native app that installs everything automatically.</p>
      <button class="download-btn" id="downloadBtn">Download Installer</button>
    </div>

    <div class="divider">or</div>

    <!-- Fallback: Terminal -->
    <div class="fallback-section">
      <h4>Run this in a terminal instead</h4>
      <div class="cmd-block" id="cmdBlock" title="Click to copy">
        Loading…
        <span class="copy-label">click to copy</span>
      </div>
    </div>

    <button class="check-btn" id="checkBtn">Check Connection</button>
    <div class="status-msg" id="statusMsg"></div>

    <p class="note" id="noteText"></p>
  </div>

  <script src="setup.js"></script>
</body>
</html>
