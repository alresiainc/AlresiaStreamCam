<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamCam Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: #09090b; color: #fafafa;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: #111113; border: 1px solid #222225; border-radius: 16px;
      padding: 48px 40px 40px; max-width: 440px; width: 92%; text-align: center;
    }

    .icon {
      width: 56px; height: 56px; margin: 0 auto 20px;
      background: #1a1a1d; border-radius: 14px; border: 1px solid #222225;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 28px; height: 28px; }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .subtitle { font-size: 13px; color: #71717a; margin-bottom: 28px; line-height: 1.5; }

    .platform-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: #18181b; border: 1px solid #27272a; border-radius: 20px;
      padding: 6px 14px; font-size: 12px; color: #a1a1aa; font-weight: 500;
      margin-bottom: 24px;
    }
    .platform-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

    .download-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px 24px;
      background: #E8491D; color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s; letter-spacing: -0.01em;
    }
    .download-btn:hover { opacity: 0.9; }
    .download-btn:disabled { opacity: 0.4; cursor: default; }
    .download-btn svg { width: 18px; height: 18px; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0 20px; color: #3f3f46; font-size: 11px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #222225;
    }

    .alt-note {
      font-size: 12px; color: #52525b; line-height: 1.6;
      margin-bottom: 20px;
    }

    .check-btn {
      width: 100%; padding: 12px;
      background: transparent; color: #a1a1aa;
      border: 1px solid #27272a; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .check-btn:hover { border-color: #3f3f46; color: #fafafa; }
    .check-btn:disabled { opacity: 0.4; cursor: default; }

    .status { margin-top: 16px; font-size: 13px; min-height: 20px; }
    .status.ok { color: #22c55e; }
    .status.err { color: #ef4444; }

    .ext-id {
      margin-top: 20px; font-size: 11px; color: #27272a;
      font-family: 'SF Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="6" stroke="#E8491D" stroke-width="2" fill="none"/>
        <circle cx="14" cy="14" r="2.5" fill="#E8491D"/>
      </svg>
    </div>

    <h1>Setup Required</h1>
    <p class="subtitle">Install the native host to use virtual camera<br>and streaming features.</p>

    <div class="platform-tag">
      <span class="dot"></span>
      <span id="platformBadge">Detecting…</span>
    </div>

    <button class="download-btn" id="downloadBtn">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3v10M6 9l4 4 4-4M3 15v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span id="downloadLabel">Download Installer</span>
    </button>

    <div class="divider">then</div>

    <p class="alt-note">
      Run the downloaded file and follow the prompts.<br>
      It installs everything automatically.
    </p>

    <button class="check-btn" id="checkBtn" style="display:none">
      I installed it — check connection
    </button>

    <div class="status" id="statusMsg"></div>
    <div class="ext-id" id="noteText"></div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
